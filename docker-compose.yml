services:
  api:
    build:
      context: .
      dockerfile: LinkedInPortfolio.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal;Port=3307;User=root;Password=Tuwaiq@123;Database=LinkedIn;AllowUserVariables=True;CharSet=utf8mb4"
      Jwt__Key: "dev-secret-key-must-be-at-least-32-characters-long!!"
      Jwt__Issuer: "LinkedInPortfolio"
      Jwt__Audience: "LinkedInPortfolio"
      Jwt__ExpiryDays: "7"
      LinkedIn__ClientId: ${LINKEDIN_CLIENT_ID:-}
      LinkedIn__ClientSecret: ${LINKEDIN_CLIENT_SECRET:-}
      LinkedIn__RedirectUri: http://localhost:3000/api/auth/linkedin/callback
      LinkedIn__FrontendCallbackUrl: http://localhost:3000/auth/callback
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
      - linkedin-net

  frontend:
    build:
      context: ./linkedin-portfolio-ui
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - linkedin-net

networks:
  linkedin-net:
    driver: bridge
